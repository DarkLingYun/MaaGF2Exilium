name: install

on:
  push:
    tags:
      - "v*"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
      - "pyproject.toml"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          if $is_release; then
            # 直接从 github.ref 提取 tag 名称
            tag=${GITHUB_REF#refs/tags/}
          else
            tag=$(git describe --tags --match "v*" HEAD || true)
            if [[ $tag != v* ]]; then
              tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
              if [[ $tag != v* ]]; then
                tag="v0.0.0"
              fi
              tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
            fi
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}

  update:
    needs: meta
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: update
        shell: bash
        run: |
          mkdir -p ./update
          rsync -av --exclude='MaaCommonAssets' ./assets/ ./update/


      - uses: actions/upload-artifact@v4
        with:
          name: update
          path: "update"

  build:
    needs: meta
    strategy:
      matrix:
        # MXU 的产物命名与 MaaFramework 一致（win/macos + x86_64/aarch64），
        # 因此不再需要 mfa_os_name / mfa_arch 这两列 MFAAvalonia 专用的别名。
        include:
          - os: windows-latest
            os_name: win
            arch: aarch64
          - os: windows-latest
            os_name: win
            arch: x86_64
          - os: macos-latest
            os_name: macos
            arch: aarch64
          - os: macos-latest
            os_name: macos
            arch: x86_64
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-${{ matrix.os_name }}-${{ matrix.arch }}*"
          latest: true
          out-file-path: "deps"
          extract: true

      - name: Download embedded Python
        if: matrix.os_name == 'win'
        shell: bash
        run: |
          PYTHON_TAG="20250708"
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            PYTHON_ARCH="x86_64"
          else
            PYTHON_ARCH="aarch64"
          fi
          PYTHON_URL="https://github.com/astral-sh/python-build-standalone/releases/download/${PYTHON_TAG}/cpython-3.11.13+${PYTHON_TAG}-${PYTHON_ARCH}-pc-windows-msvc-install_only.tar.gz"
          echo "Downloading Python from: $PYTHON_URL"
          mkdir -p deps/python
          curl -fsSL "$PYTHON_URL" -o deps/python.tar.gz
          tar -xzf deps/python.tar.gz -C deps/python --strip-components=1
          rm deps/python.tar.gz
          # x86_64 runner 可以执行 x86_64 Python，ARM64 不行
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            echo "Python version:"
            deps/python/python.exe --version
            deps/python/python.exe - <<'PY'
          import pathlib, subprocess, sys, tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          subprocess.run([sys.executable, "-m", "pip", "install", "--no-cache-dir",
                          "maafw", "maaagentbinary", *project["project"]["dependencies"]], check=True)
          PY
            echo "maafw installed into embedded Python."
          else
            echo "Skipping pip install (cross-architecture, will install on device)."
          fi

      - name: Download MXU
        uses: robinraju/release-downloader@v1
        with:
          repository: MistEO/MXU
          fileName: "MXU-${{ matrix.os_name }}-${{ matrix.arch }}-*"
          latest: true
          out-file-path: "MXU"
          extract: true

      - name: Clean up MXU archive files
        shell: bash
        run: |
          # Remove any remaining archive files after extraction
          find ./MXU -type f \( -name "*.zip" -o -name "*.tar" -o -name "*.tar.gz" -o -name "*.7z" -o -name "*.rar" \) -delete
          echo "Cleaned up archive files in MXU directory"

      - name: Convert PNG to ICO
        shell: bash
        run: |
          if [ "${{ matrix.os_name }}" = "win" ]; then
            choco install imagemagick -y
            magick convert imgs/图标2.png -define icon:auto-resize=256,128,64,48,32,24,16 gf2.ico
          elif [ "${{ matrix.os_name }}" = "macos" ]; then
            brew install imagemagick
            magick convert imgs/图标2.png -define icon:auto-resize=256,128,64,48,32,24,16 gf2.ico
          fi

      - name: Modify MXU exe icon
        if: matrix.arch == 'x86_64' && matrix.os_name == 'win'
        shell: bash
        run: |
          curl -L "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -o rcedit.exe
          ./rcedit.exe "MXU/mxu.exe" --set-icon "gf2.ico"
          echo "MXU icon modified successfully"

      - name: Install
        shell: bash
        run: |
          python ./install.py ${{ needs.meta.outputs.tag }}
          # 这里不再用 --arg version 覆盖 version 字段：install.py 的 to_mxu_version()
          # 会给它打上 -mxu 后缀，把 MXU 构建标记成 MXU 认定中的「非正式版本」以跳过
          # MirrorChyan 更新检查，在此覆盖等于把它抹掉。
          if [ "${{ matrix.os_name }}" = "win" ]; then
            jq --arg url "https://github.com/DarkLingYun/MaaGF2Exilium" '. + {"url": $url}' ./install/interface.json > ./install/interface.json.tmp && mv ./install/interface.json.tmp ./install/interface.json
          fi

      - name: Install custom app icon
        shell: bash
        run: |
          # MXU 的界面图标取自 interface.json 顶层的 icon 字段（相对项目根目录），
          # 不再像 MFAAvalonia 那样读 Assets/ 目录。
          mkdir -p install/assets
          if [ -f "gf2.ico" ]; then
            cp gf2.ico install/assets/logo.ico
            echo "Copied custom icon to assets/logo.ico"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MaaGF2ExiliumGUI-${{ matrix.os_name }}-${{ matrix.arch }}
          path: "install"
        
  android:
    if: needs.meta.outputs.is_release == 'true'
    needs: meta
    uses: ./.github/workflows/android-build.yml
    with:
      assemble: release
      version: ${{ needs.meta.outputs.tag }}
    secrets: inherit

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, update, build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MaaGF2ExiliumGUI-*
          path: assets

      - uses: actions/download-artifact@v4
        with:
          name: update
          path: assets/update

      - run: |
          cd assets
          for f in *; do
            (cd "$f" && 7z a -tzip ../"$f-${{ needs.meta.outputs.tag }}.zip" .)
          done
      - uses: actions/download-artifact@v4
        with:
          pattern: android-release-*
          merge-multiple: true
          path: android-apks
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/*.zip
            android-apks/*.apk
          tag_name: ${{ needs.meta.outputs.tag }}
          append_body: true
          body: |
            [已有 Mirror酱 CDK? 前往Mirror酱高速下载](https://mirrorchyan.com/zh/projects?rid=MaaGF2Exilium)

      - name: Trigger MirrorChyanUploading
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
