name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "Android/**"
      - "assets/**"
      - "imgs/图标2.png"
      - "LICENSE"
      - ".gitmodules"
      - "scripts/prepare_android.py"
      - "scripts/android_version.py"
      - "tests/test_android_packaging.py"
      - ".github/workflows/android*.yml"
  pull_request:
    paths:
      - "Android/**"
      - "assets/**"
      - "imgs/图标2.png"
      - "LICENSE"
      - ".gitmodules"
      - "scripts/prepare_android.py"
      - "scripts/android_version.py"
      - "tests/test_android_packaging.py"
      - ".github/workflows/android*.yml"
  workflow_dispatch:
    inputs:
      assemble:
        description: "APK build type (release requires signing secrets; artifacts only)"
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    uses: ./.github/workflows/android-build.yml
    with:
      assemble: ${{ github.event_name == 'workflow_dispatch' && inputs.assemble || 'debug' }}
    secrets: inherit
